# Local HTTP testing uses the real application and Flyway-built MySQL schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.uk.gegc.quizmaker=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.orm.jpa=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# Same private readiness groups as deployment; management is container-only.
management.server.port=8081
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,info
management.health.mail.enabled=false
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState,ping
management.endpoint.health.group.readiness.include=readinessState,db,diskSpace
management.endpoint.health.group.startup.include=ping,db

# Deliberately fake provider configuration, independent of the checkout's .env.
# The internal Docker network also prevents outbound provider access.
OPENAI_API_KEY=local-offline-not-real
STRIPE_SECRET_KEY=sk_test_local_offline_not_real
STRIPE_WEBHOOK_SECRET=whsec_local_offline_not_real
# Empty prices keep the existing startup initializer from fetching Stripe data.
STRIPE_PRICE_SMALL=
STRIPE_PRICE_MEDIUM=
STRIPE_PRICE_LARGE=
STRIPE_PRICE_SUBSCRIPTION=
billing.pack-sync.enabled=false
app.email.provider=noop
app.media.access-key=local-offline-not-real
app.media.secret-key=local-offline-not-real
app.media.endpoint=http://127.0.0.1:9
app.media.cdn-base-url=http://127.0.0.1:9

# Explicit opt-in for synthetic local Learning HTTP checks; never a production default.
quizmaker.learning.sessions-enabled=true
quizmaker.learning.custom-plans-enabled=true
quizmaker.learning.custom-reviews-enabled=true
quizmaker.learning.sets-enabled=true
quizmaker.learning.due.max-batch-size=20
