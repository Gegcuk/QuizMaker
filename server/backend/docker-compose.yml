services:
  quizmaker-backend:
    image: ${BACKEND_IMAGE:-quizmaker-backend:local}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/quizmakerdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.6-luna}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-1.0}
      - OPENAI_MAX_COMPLETION_TOKENS=${OPENAI_MAX_COMPLETION_TOKENS:-16000}
      # Bounded provider execution; defaults preserve deployment compatibility.
      - ASYNC_AI_PROVIDER_CORE_POOL_SIZE=${ASYNC_AI_PROVIDER_CORE_POOL_SIZE:-8}
      - ASYNC_AI_PROVIDER_MAX_POOL_SIZE=${ASYNC_AI_PROVIDER_MAX_POOL_SIZE:-16}
      - ASYNC_AI_PROVIDER_QUEUE_CAPACITY=${ASYNC_AI_PROVIDER_QUEUE_CAPACITY:-50}
      - ASYNC_AI_PROVIDER_KEEP_ALIVE_SECONDS=${ASYNC_AI_PROVIDER_KEEP_ALIVE_SECONDS:-60}
      - ASYNC_AI_PROVIDER_AWAIT_TERMINATION_SECONDS=${ASYNC_AI_PROVIDER_AWAIT_TERMINATION_SECONDS:-30}
      - JWT_SECRET=${JWT_SECRET}
      - TOKEN_PEPPER_SECRET=${TOKEN_PEPPER_SECRET}
      - RESET_TOKEN_PEPPER=${RESET_TOKEN_PEPPER}
      - VERIFICATION_TOKEN_PEPPER=${VERIFICATION_TOKEN_PEPPER}
      # OAuth2 Configuration
      - OAUTH2_REDIRECT_URI=${OAUTH2_REDIRECT_URI}
      - OAUTH2_TOKEN_SECRET=${OAUTH2_TOKEN_SECRET}
      # OAuth2 Providers
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OAUTH_GITHUB_CLIENT_ID=${OAUTH_GITHUB_CLIENT_ID}
      - OAUTH_GITHUB_CLIENT_SECRET=${OAUTH_GITHUB_CLIENT_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_PRICE_SMALL=${STRIPE_PRICE_SMALL}
      - STRIPE_PRICE_MEDIUM=${STRIPE_PRICE_MEDIUM}
      - STRIPE_PRICE_LARGE=${STRIPE_PRICE_LARGE}
      - STRIPE_PRICE_SUBSCRIPTION=${STRIPE_PRICE_SUBSCRIPTION}
      - STRIPE_SUCCESS_URL=${STRIPE_SUCCESS_URL}
      - STRIPE_CANCEL_URL=${STRIPE_CANCEL_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL}
      - BILLING_TOKEN_TO_LLM_RATIO=${BILLING_TOKEN_TO_LLM_RATIO}
      - BILLING_GENERATION_TARIFF_VERSION=${BILLING_GENERATION_TARIFF_VERSION:-v1-content-length-per-question-type}
      - BILLING_GENERATION_BASE_TOKENS=${BILLING_GENERATION_BASE_TOKENS:-3}
      - BILLING_GENERATION_TOKENS_PER_THOUSAND_CHARACTERS=${BILLING_GENERATION_TOKENS_PER_THOUSAND_CHARACTERS:-0.35}
      # Isolated document parser process limits
      - DOCUMENT_MAX_CONCURRENT_PARSES=${DOCUMENT_MAX_CONCURRENT_PARSES:-2}
      - DOCUMENT_MAX_CONCURRENT_PARSES_PER_USER=${DOCUMENT_MAX_CONCURRENT_PARSES_PER_USER:-1}
      - DOCUMENT_PARSE_TIMEOUT=${DOCUMENT_PARSE_TIMEOUT:-PT60S}
      - DOCUMENT_PARSER_WORKER_MAX_HEAP_BYTES=${DOCUMENT_PARSER_WORKER_MAX_HEAP_BYTES:-402653184}
      - DOCUMENT_PARSER_WORKER_MAX_OUTPUT_BYTES=${DOCUMENT_PARSER_WORKER_MAX_OUTPUT_BYTES:-16777216}
      - DOCUMENT_PARSER_TERMINATION_GRACE=${DOCUMENT_PARSER_TERMINATION_GRACE:-PT1S}
      - DOCUMENT_PARSER_FORCE_KILL_TIMEOUT=${DOCUMENT_PARSER_FORCE_KILL_TIMEOUT:-PT5S}
      - DOCUMENT_PARSER_SHUTDOWN_TIMEOUT=${DOCUMENT_PARSER_SHUTDOWN_TIMEOUT:-PT10S}
      - DOCUMENT_STAGING_RETENTION=${DOCUMENT_STAGING_RETENTION:-PT24H}
      # AWS SES Email Configuration
      - APP_EMAIL_PROVIDER=${APP_EMAIL_PROVIDER}
      - APP_EMAIL_FROM=${APP_EMAIL_FROM}
      - APP_EMAIL_REGION=${APP_EMAIL_REGION}
      - APP_EMAIL_SES_CONFIGURATION_SET=${APP_EMAIL_SES_CONFIGURATION_SET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      # DigitalOcean Spaces / CDN
      - MEDIA_BUCKET=${MEDIA_BUCKET}
      - MEDIA_REGION=${MEDIA_REGION}
      - MEDIA_ENDPOINT=${MEDIA_ENDPOINT}
      - MEDIA_CDN_BASE_URL=${MEDIA_CDN_BASE_URL}
      - DO_SPACES_ACCESS_KEY=${DO_SPACES_ACCESS_KEY}
      - DO_SPACES_SECRET_KEY=${DO_SPACES_SECRET_KEY}
      - MEDIA_UPLOAD_URL_TTL=${MEDIA_UPLOAD_URL_TTL}
      - MEDIA_MAX_IMAGE_SIZE_BYTES=${MEDIA_MAX_IMAGE_SIZE_BYTES}
      - MEDIA_MAX_DOC_SIZE_BYTES=${MEDIA_MAX_DOC_SIZE_BYTES}
      - MEDIA_DELETE_REMOTE=${MEDIA_DELETE_REMOTE}
      - MEDIA_ARTICLE_PREFIX=${MEDIA_ARTICLE_PREFIX}
      - MEDIA_LIBRARY_PREFIX=${MEDIA_LIBRARY_PREFIX}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - quizmaker-network

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=quizmakerdb
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_ROOT_HOST=%
      - MYSQL_INIT_SHOW_SECRETS=${MYSQL_INIT_SHOW_SECRETS:-0}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:3306:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$MYSQL_ROOT_PASSWORD"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - quizmaker-network
    command: --innodb-buffer-pool-size=128M --max-connections=200

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local

networks:
  quizmaker-network:
    driver: bridge
