# app name
spring.application.name=QuizMaker
# MySQL connection (CI or local)
spring.datasource.url=jdbc:mysql://localhost:3306/quizmakerdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=bestuser
spring.datasource.password=bestuser
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# Use Hibernate schema management for now; migrations will take over later
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
logging.level.org.springframework=DEBUG
logging.level.uk.gegc.quizmaker=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.springframework.orm.jpa=DEBUG
spring.config.import=optional:classpath:secret.properties,optional:file:.env[.properties],optional:classpath:seo.properties
jwt.secret=${JWT_SECRET:your-super-secret-jwt-key-change-this-in-production}
jwt.access-expiration-ms=43200000
jwt.refresh-expiration-ms=604800000
# API Documentation (groups defined in OpenApiGroupConfig.java)
# Enable API documentation
springdoc.api-docs.enabled=true
# Enable Swagger UI
springdoc.swagger-ui.enabled=true
# Optional: Reduce spec size for better performance
springdoc.writer-with-default-pretty-printer=false
# Enable cache to improve performance
springdoc.cache.disabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# Document Processing Configuration
document.chunking.max-chunk-size=100000
document.chunking.min-chunk-size=300
document.chunking.aggressive-combination-threshold=5000
document.chunking.default-strategy=SIZE_BASED
# File Upload Configuration
spring.servlet.multipart.max-file-size=${DOCUMENT_MAX_UPLOAD_BYTES:157286400}
spring.servlet.multipart.max-request-size=${DOCUMENT_MAX_UPLOAD_BYTES:157286400}
spring.servlet.multipart.enabled=true

# Document ingestion safety limits. Upload bytes are checked before streaming and
# again while staging; parser limits are independent of multipart limits.
quizmaker.document.processing.max-upload-bytes=${DOCUMENT_MAX_UPLOAD_BYTES:157286400}
quizmaker.document.processing.max-extracted-characters=${DOCUMENT_MAX_EXTRACTED_CHARACTERS:1000000}
quizmaker.document.processing.max-pdf-pages=${DOCUMENT_MAX_PDF_PAGES:1500}
quizmaker.document.processing.max-pdf-main-memory-bytes=${DOCUMENT_MAX_PDF_MAIN_MEMORY_BYTES:16777216}
quizmaker.document.processing.max-pdf-storage-bytes=${DOCUMENT_MAX_PDF_STORAGE_BYTES:536870912}
quizmaker.document.processing.pdf-scratch-retention=${DOCUMENT_PDF_SCRATCH_RETENTION:PT24H}
quizmaker.document.processing.max-epub-entries=${DOCUMENT_MAX_EPUB_ENTRIES:10000}
quizmaker.document.processing.max-epub-uncompressed-bytes=${DOCUMENT_MAX_EPUB_UNCOMPRESSED_BYTES:314572800}
quizmaker.document.processing.max-epub-compression-ratio=${DOCUMENT_MAX_EPUB_COMPRESSION_RATIO:100}
quizmaker.document.processing.max-concurrent-parses=${DOCUMENT_MAX_CONCURRENT_PARSES:2}
quizmaker.document.processing.max-concurrent-parses-per-user=${DOCUMENT_MAX_CONCURRENT_PARSES_PER_USER:1}
quizmaker.document.processing.parse-timeout=${DOCUMENT_PARSE_TIMEOUT:PT60S}
quizmaker.document.processing.parser-worker-max-heap-bytes=${DOCUMENT_PARSER_WORKER_MAX_HEAP_BYTES:402653184}
quizmaker.document.processing.parser-worker-max-output-bytes=${DOCUMENT_PARSER_WORKER_MAX_OUTPUT_BYTES:16777216}
quizmaker.document.processing.parser-termination-grace=${DOCUMENT_PARSER_TERMINATION_GRACE:PT1S}
quizmaker.document.processing.parser-force-kill-timeout=${DOCUMENT_PARSER_FORCE_KILL_TIMEOUT:PT5S}
quizmaker.document.processing.parser-shutdown-timeout=${DOCUMENT_PARSER_SHUTDOWN_TIMEOUT:PT10S}
quizmaker.document.processing.staging-retention=${DOCUMENT_STAGING_RETENTION:PT24H}
quizmaker.document.processing.reconciliation-interval=${DOCUMENT_RECONCILIATION_INTERVAL:PT1H}
quizmaker.document.processing.storage-root=${DOCUMENT_STORAGE_ROOT:uploads/documents}

# DocumentProcess Configuration
docproc.normalization.dehyphenate=true
docproc.normalization.collapse-spaces=true
docproc.ai.default-model=gpt-4o-mini
docproc.ai.headroom-ratio=0.25
# OpenAI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Clock Configuration
# Default timezone for the application Clock
# Options: UTC, Europe/London, America/New_York, etc.
app.timezone=UTC
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-5.6-luna}
# GPT-5.6 Luna accepts only the default sampling temperature of 1.
spring.ai.openai.chat.options.temperature=${OPENAI_TEMPERATURE:1.0}

# Maximum tokens for completion (output) to prevent truncated JSON responses
# Default: 16000 tokens (sufficient for 10 complex questions with structured output)
# Keep structured question responses bounded to avoid truncated JSON and uncontrolled output cost.
spring.ai.openai.chat.options.max-completion-tokens=${OPENAI_MAX_COMPLETION_TOKENS:16000}

# Feature flags (Day-0 default: on in dev, can override in prod)
quizmaker.features.share-links=true
quizmaker.features.organizations=true
quizmaker.features.billing=true

# Admin feature flags
app.admin.system-initialization.enabled=true

# Share Links security
quizmaker.share-links.token-pepper=${TOKEN_PEPPER_SECRET}

# Enable Problem+JSON standardized errors
spring.mvc.problemdetails.enabled=true

# Enable Flyway by default
spring.flyway.enabled=true
# Temporarily disable validation to bypass corrupted schema history
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=false

# Quiz import defaults
quiz.import.max-items=1000
quiz.import.rate-limit-per-minute=10

# AI Rate Limiting Configuration
ai.rate-limit.max-retries=5
ai.rate-limit.max-attempts-per-task=5
ai.rate-limit.base-delay-ms=1000
ai.rate-limit.max-delay-ms=60000
ai.rate-limit.jitter-factor=0.25

# Async Configuration
# AI Operations Thread Pool
async.ai.core-pool-size=4
async.ai.max-pool-size=8
async.ai.queue-capacity=50
async.ai.keep-alive-seconds=60

# Provider-bound chunk work uses a separate pool so orchestration workers never
# block the workers required to complete their own futures.
async.ai.provider.core-pool-size=8
async.ai.provider.max-pool-size=16
async.ai.provider.queue-capacity=50
async.ai.provider.keep-alive-seconds=60
async.ai.provider.await-termination-seconds=30

# General Operations Thread Pool
async.general.core-pool-size=2
async.general.max-pool-size=4
async.general.queue-capacity=25
async.general.keep-alive-seconds=60

# CORS Configuration
# Allowed origins - Configure based on your frontend URLs
# For production, replace with your actual domain(s)
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:5173
# For development with dynamic ports (e.g., Vite), set this to true
app.cors.use-origin-patterns=false
# Allowed HTTP methods including HEAD for cache validation
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD
# Allowed headers in requests - add more as needed
app.cors.allowed-headers=Authorization,Content-Type,Accept,X-Requested-With,Origin,If-None-Match,Accept-Language
# Headers exposed to the client (response headers the browser can access)
app.cors.exposed-headers=Location,Link,Content-Disposition,X-Total-Count,X-RateLimit-Limit,X-RateLimit-Remaining,X-RateLimit-Reset
# Allow credentials (cookies, authorization headers) - set to false if using only JWT in header
app.cors.allow-credentials=true
# Max age for preflight cache (1 hour)
app.cors.max-age=3600

# Email Configuration (SMTP - legacy, used when app.email.provider=smtp)
# NOTE: SMTP is deprecated in favor of AWS SES. Only use if SES is unavailable.
spring.mail.host=${SMTP_HOST:smtp.example.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_USE_TLS:true}
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

# Frontend Configuration
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}

# Email Provider Configuration
# Options: ses (AWS SES via HTTPS), smtp (legacy SMTP), noop (logging only, no sending)
# Default: noop (safe for local dev)
app.email.provider=${APP_EMAIL_PROVIDER:noop}
# Sender email address (must be verified in SES if using provider=ses)
app.email.from=${APP_EMAIL_FROM:noreply@example.com}
# AWS region for SES (only used when provider=ses)
app.email.region=${APP_EMAIL_REGION:us-east-1}
# Optional: SES Configuration Set name for event tracking
app.email.ses.configuration-set=${APP_EMAIL_SES_CONFIGURATION_SET:}
# Max timeout for an SES API call (milliseconds)
app.email.ses.api-call-timeout-ms=${APP_EMAIL_SES_API_CALL_TIMEOUT_MS:30000}
# Timeout per HTTP attempt (milliseconds)
app.email.ses.api-call-attempt-timeout-ms=${APP_EMAIL_SES_API_CALL_ATTEMPT_TIMEOUT_MS:10000}
# HTTP connection timeout (milliseconds)
app.email.ses.http-connection-timeout-ms=${APP_EMAIL_SES_HTTP_CONNECTION_TIMEOUT_MS:5000}
# HTTP socket/read timeout (milliseconds)
app.email.ses.http-socket-timeout-ms=${APP_EMAIL_SES_HTTP_SOCKET_TIMEOUT_MS:15000}
# Email template resource locations (plain text for now)
app.email.templates.password-reset=${APP_EMAIL_TEMPLATE_PASSWORD_RESET:classpath:email/password-reset-email.txt}
app.email.templates.verification=${APP_EMAIL_TEMPLATE_EMAIL_VERIFICATION:classpath:email/email-verification-email.txt}

# Email Application Configuration
app.email.password-reset.subject=Password Reset Request - QuizMaker
app.email.verification.subject=Email Verification - QuizMaker

# Bug report notifications
app.bug-report.recipient=${BUG_REPORT_RECIPIENT:gegcuk@gmail.com}
app.bug-report.subject=${BUG_REPORT_SUBJECT:New Bug Report}
app.bug-report.rate-limit-per-minute=${BUG_REPORT_RATE_LIMIT_PER_MINUTE:5}

# Auth Configuration
app.auth.reset-token-ttl-minutes=60
app.auth.reset-token-pepper=${RESET_TOKEN_PEPPER:please_set_a_strong_random_value}
app.auth.verification-token-ttl-minutes=1440
app.auth.verification-token-pepper=${VERIFICATION_TOKEN_PEPPER:please_set_a_strong_random_value}
# Registration bonus tokens granted to new users
app.auth.registration-bonus-tokens=100

# OAuth2 Configuration
# Redirect URI where OAuth providers should send users after authentication
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/redirect}
# Base64 encoded 256-bit key used to encrypt provider tokens at rest
app.oauth2.token-secret=${OAUTH2_TOKEN_SECRET:lrPUVT2UZTcTqiRvLjrl0XWrnTl+BV5FEbSqxzXwKYE=}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:local-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:local-google-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# GitHub OAuth2
spring.security.oauth2.client.registration.github.client-id=${OAUTH_GITHUB_CLIENT_ID:local-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${OAUTH_GITHUB_CLIENT_SECRET:local-github-client-secret}
spring.security.oauth2.client.registration.github.scope=user:email,read:user
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Facebook OAuth2
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:local-facebook-client-id}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:local-facebook-client-secret}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Microsoft OAuth2
spring.security.oauth2.client.registration.microsoft.client-id=${MICROSOFT_CLIENT_ID:local-microsoft-client-id}
spring.security.oauth2.client.registration.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:local-microsoft-client-secret}
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.microsoft.client-name=Microsoft

# Microsoft Provider Configuration
spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/common/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/common/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.user-info-uri=https://graph.microsoft.com/oidc/userinfo
spring.security.oauth2.client.provider.microsoft.jwk-set-uri=https://login.microsoftonline.com/common/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-name-attribute=sub

# Security Configuration
app.security.enable-forwarded-headers=${ENABLE_FORWARDED_HEADERS:false}
app.security.trusted-proxies=${TRUSTED_PROXIES:127.0.0.1,::1,localhost}

# Document Chunking Configuration
quizmaker.document.chunking.max-single-chunk-tokens=150000
quizmaker.document.chunking.max-single-chunk-chars=4000000
quizmaker.document.chunking.overlap-tokens=15000
quizmaker.document.chunking.model-max-tokens=400000
quizmaker.document.chunking.prompt-overhead-tokens=15000
quizmaker.document.chunking.aggressive-chunking=true
quizmaker.document.chunking.enable-emergency-chunking=true

# Billing Configuration
billing.token-to-llm-ratio=${BILLING_TOKEN_TO_LLM_RATIO:1000}
billing.reservation-ttl-minutes=${BILLING_RESERVATION_TTL_MINUTES:120}
billing.reservation-sweeper-ms=${BILLING_RESERVATION_SWEEPER_MS:60000}
billing.safety-factor=${BILLING_SAFETY_FACTOR:1.2}
billing.currency=${BILLING_CURRENCY:usd}
billing.generation.tariff-version=${BILLING_GENERATION_TARIFF_VERSION:v1-content-length-per-question-type}
billing.generation.base-tokens=${BILLING_GENERATION_BASE_TOKENS:3}
billing.generation.tokens-per-thousand-characters=${BILLING_GENERATION_TOKENS_PER_THOUSAND_CHARACTERS:0.35}
billing.refund-policy=${BILLING_REFUND_POLICY:ALLOW_NEGATIVE_BALANCE}
billing.pack-sync.enabled=${BILLING_PACK_SYNC_ENABLED:true}
billing.pack-sync.fixed-delay-ms=${BILLING_PACK_SYNC_FIXED_DELAY_MS:3600000}

# Stripe Configuration
# Note: do not set defaults for secret keys to avoid creating empty-key clients.
# Provide via environment variables or externalized config.
# Default to empty string for CI/test environments where Stripe is not configured
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:pk_test_...}
stripe.success-url=${STRIPE_SUCCESS_URL:${app.frontend.base-url}/billing/success}
stripe.cancel-url=${STRIPE_CANCEL_URL:${app.frontend.base-url}/billing/cancel}
stripe.price.small=${STRIPE_PRICE_SMALL}
stripe.price.medium=${STRIPE_PRICE_MEDIUM}
stripe.price.large=${STRIPE_PRICE_LARGE}
stripe.price.subscription=${STRIPE_PRICE_SUBSCRIPTION}

# Additional relaxed-binding keys to map to StripeProperties fields directly
stripe.priceSmall=${STRIPE_PRICE_SMALL}
stripe.priceMedium=${STRIPE_PRICE_MEDIUM}
stripe.priceLarge=${STRIPE_PRICE_LARGE}
stripe.priceSubscription=${STRIPE_PRICE_SUBSCRIPTION}

# Quiz Generation Job Resilience Configuration
# Timeout for PENDING jobs to transition to PROCESSING (minutes)
quiz.jobs.pending-activation-timeout-minutes=2
# Fixed delay between cleanup scheduler runs (seconds)
quiz.jobs.cleanup-fixed-delay-seconds=60
# Minimum age for cancellation via API (seconds, 0 = immediate)
quiz.jobs.min-cancel-age-seconds=0

# The finalization transaction starts only after AI work is complete. These settings
# recover an interrupted finalization without retaining a transaction during AI calls.
quiz.jobs.finalization.recovery-grace-seconds=300
quiz.jobs.finalization.recovery-fixed-delay-seconds=60
quiz.jobs.finalization.checkpoint-max-bytes=8388608
quiz.jobs.finalization.recovery-batch-size=50
# Cancellation policy: commit tokens if work started
quiz.jobs.cancellation.commit-on-cancel=true
quiz.jobs.cancellation.min-start-fee-tokens=0
# Rate limits for job operations
quiz.jobs.rate-limit.start.per-minute=3
quiz.jobs.rate-limit.start.per-hour=15
quiz.jobs.rate-limit.start.per-day=100
quiz.jobs.rate-limit.cancel.per-hour=5
quiz.jobs.rate-limit.cancel.per-day=50
quiz.jobs.rate-limit.cooldown-on-rapid-cancels-minutes=5

# Default category for manual quiz creation
quiz.default-category-id=00000000-0000-0000-0000-000000000001

# Quiz Analytics Snapshot Configuration
# Maximum age of snapshot before recomputation (seconds)
# 600 = 10 minutes. Set to 0 to disable staleness checking.
quizmaker.analytics.snapshot.max-age-seconds=600

# SEO Configuration

# Media / CDN configuration (DigitalOcean Spaces)
app.media.bucket=${MEDIA_BUCKET:quizzence}
app.media.region=${MEDIA_REGION:lon1}
app.media.endpoint=${MEDIA_ENDPOINT:https://lon1.digitaloceanspaces.com}
app.media.cdn-base-url=${MEDIA_CDN_BASE_URL:https://cdn.quizzence.com}
app.media.upload-url-ttl=${MEDIA_UPLOAD_URL_TTL:PT15M}
app.media.limits.allowed-image-mime-types=image/jpeg,image/png,image/webp,image/avif
app.media.limits.allowed-document-mime-types=application/pdf
app.media.limits.max-image-size-bytes=${MEDIA_MAX_IMAGE_SIZE_BYTES:20971520}
app.media.limits.max-document-size-bytes=${MEDIA_MAX_DOC_SIZE_BYTES:20971520}
app.media.key-prefix.articles=${MEDIA_ARTICLE_PREFIX:articles}
app.media.key-prefix.library=${MEDIA_LIBRARY_PREFIX:library}
app.media.delete-remote=${MEDIA_DELETE_REMOTE:false}
app.media.access-key=${DO_SPACES_ACCESS_KEY:dev-do-access-key}
app.media.secret-key=${DO_SPACES_SECRET_KEY:dev-do-secret-key}
