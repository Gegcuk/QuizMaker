name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      # Fixed fake provider credentials prove that nonblank values cannot opt CI into live calls.
      OPENAI_API_KEY: 'sk-ci-offline-not-real'
      OPENAI_MODEL: 'disabled'
      STRIPE_SECRET_KEY: 'sk_test_ci_offline_not_real'
      STRIPE_WEBHOOK_SECRET: 'whsec_ci_offline_not_real'
      AWS_ACCESS_KEY_ID: 'ci-offline-not-real'
      AWS_SECRET_ACCESS_KEY: 'ci-offline-not-real'
      RUN_REAL_SES_TESTS: 'true'
      TEST_SES_RECIPIENT_EMAIL: 'ci-offline@example.invalid'
      BILLING_PACK_SYNC_ENABLED: 'false'
      JWT_SECRET:     ${{ secrets.JWT_SECRET     || 'ci-test-secret' }}
      TOKEN_PEPPER_SECRET: ${{ secrets.TOKEN_PEPPER_SECRET || 'ci-test-pepper' }}
      SPRING_PROFILES_ACTIVE: test
      # Service containers with port mapping are accessible via localhost on the runner
      # Note: Don't set SPRING_DATASOURCE_URL here - let profile-specific properties files handle it
      # Tests with @ActiveProfiles("test-mysql") use quizmaker_test_mysql from application-test-mysql.properties
      # Tests with @ActiveProfiles("test") use quizmaker_test from application-test.properties
      SPRING_DATASOURCE_USERNAME: bestuser
      SPRING_DATASOURCE_PASSWORD: bestuser
      # Connection pool settings (environment variables override properties files)
      # Keep integration-test connection usage bounded.
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 10
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 2
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: 30000
      SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT: 5000
      
      # OAuth2 Configuration (tests use mocks, these are placeholders)
      OAUTH2_REDIRECT_URI: ${{ secrets.OAUTH2_REDIRECT_URI || 'http://localhost:3000/oauth2/redirect' }}
      OAUTH2_TOKEN_SECRET: ${{ secrets.OAUTH2_TOKEN_SECRET || 'lrPUVT2UZTcTqiRvLjrl0XWrnTl+BV5FEbSqxzXwKYE=' }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || 'ci-test-google-client-id' }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || 'ci-test-google-client-secret' }}
      OAUTH_GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID || 'ci-test-github-client-id' }}
      OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET || 'ci-test-github-client-secret' }}
      FACEBOOK_CLIENT_ID: ${{ secrets.FACEBOOK_CLIENT_ID || 'ci-test-facebook-client-id' }}
      FACEBOOK_CLIENT_SECRET: ${{ secrets.FACEBOOK_CLIENT_SECRET || 'ci-test-facebook-client-secret' }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID || 'ci-test-microsoft-client-id' }}
      MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET || 'ci-test-microsoft-client-secret' }}
      # Media / CDN (Spaces)
      MEDIA_BUCKET: ${{ secrets.MEDIA_BUCKET || 'quizzence' }}
      MEDIA_REGION: ${{ secrets.MEDIA_REGION || 'lon1' }}
      MEDIA_ENDPOINT: ${{ secrets.MEDIA_ENDPOINT || 'https://lon1.digitaloceanspaces.com' }}
      MEDIA_CDN_BASE_URL: ${{ secrets.MEDIA_CDN_BASE_URL || 'https://cdn.quizzence.com' }}
      DO_SPACES_ACCESS_KEY: ${{ secrets.DO_SPACES_ACCESS_KEY || 'ci-access-key' }}
      DO_SPACES_SECRET_KEY: ${{ secrets.DO_SPACES_SECRET_KEY || 'ci-secret-key' }}
      MEDIA_UPLOAD_URL_TTL: ${{ secrets.MEDIA_UPLOAD_URL_TTL || 'PT15M' }}
      MEDIA_MAX_IMAGE_SIZE_BYTES: ${{ secrets.MEDIA_MAX_IMAGE_SIZE_BYTES || '20971520' }}
      MEDIA_MAX_DOC_SIZE_BYTES: ${{ secrets.MEDIA_MAX_DOC_SIZE_BYTES || '20971520' }}
      MEDIA_DELETE_REMOTE: ${{ secrets.MEDIA_DELETE_REMOTE || 'false' }}
      MEDIA_ARTICLE_PREFIX: ${{ secrets.MEDIA_ARTICLE_PREFIX || 'articles' }}
      MEDIA_LIBRARY_PREFIX: ${{ secrets.MEDIA_LIBRARY_PREFIX || 'library' }}

    services:
      mysql:
        image: mysql:8.4  # LTS line
        ports:
          - 3306:3306
        env:
          MYSQL_DATABASE: quizmaker_test
          MYSQL_USER: bestuser
          MYSQL_PASSWORD: bestuser
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Resolve Maven dependencies for offline verification
        run: ./mvnw -B -DskipTests dependency:go-offline

      - name: Ensure network namespace tools are available
        run: |
          if ! command -v ip >/dev/null 2>&1 || ! command -v socat >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes iproute2 socat
          fi
          command -v ip
          command -v runuser
          command -v socat

      - name: Check MySQL container status
        run: |
          echo "🔍 Checking MySQL service container status..."
          echo ""
          echo "Docker containers:"
          docker ps -a | grep -i mysql || echo "  ⚠️ No MySQL containers found"
          echo ""
          echo "Docker network:"
          docker network ls | grep -E "bridge|github" || echo "  ⚠️ No relevant networks found"
          echo ""
          echo "Checking for MySQL service container..."
          # Try to get service container info
          MYSQL_CONTAINER=$(docker ps -a --filter "name=mysql" --format "{{.ID}}" | head -1)
          if [ -n "$MYSQL_CONTAINER" ]; then
            echo "✅ Found MySQL container: $MYSQL_CONTAINER"
            echo ""
            echo "Container status:"
            docker ps -a --filter "id=$MYSQL_CONTAINER" --format "table {{.ID}}\t{{.Status}}\t{{.Names}}\t{{.Ports}}"
            echo ""
            echo "MySQL container logs (last 30 lines):"
            docker logs --tail=30 "$MYSQL_CONTAINER" 2>&1 || echo "  ⚠️ Cannot read container logs"
          else
            echo "⚠️ MySQL container not found yet (this is normal if it's still starting)"
          fi
          echo ""
          echo "Checking if port 3306 is listening on localhost:"
          netstat -an | grep 3306 || ss -an | grep 3306 || echo "  ⚠️ Port 3306 not listening yet"

      - name: Wait for MySQL to be healthy
        run: |
          set +e  # Disable exit on error since we handle failures explicitly
          echo "Waiting for MySQL service to be ready (accessible via localhost:3306)..."
          echo ""
          
          # Function to show MySQL container logs
          show_mysql_logs() {
            MYSQL_CONTAINER=$(docker ps -a --filter "name=mysql" --format "{{.ID}}" | head -1)
            if [ -n "$MYSQL_CONTAINER" ]; then
              echo "📋 MySQL container logs (last 10 lines):"
              docker logs --tail=10 "$MYSQL_CONTAINER" 2>&1 | sed 's/^/  /' || true
            fi
          }
          
          # Wait a moment for MySQL to fully initialize after health check passes
          echo "⏳ Waiting 5 seconds for MySQL to fully initialize..."
          sleep 5
          
          # Check if mysqladmin is available (might not be installed in runner)
          if command -v mysqladmin >/dev/null 2>&1; then
            echo "✅ MySQL client tools available"
            echo "ℹ️ Using 127.0.0.1 (TCP/IP) instead of localhost to avoid Unix socket issues"
            MYSQL_READY=0
            for i in {1..60}; do
              # Try to ping MySQL and show error if it fails
              # Use 127.0.0.1 instead of localhost to force TCP/IP connection (not Unix socket)
              PING_OUTPUT=$(mysqladmin ping -h 127.0.0.1 -uroot -proot 2>&1)
              PING_STATUS=$?
              
              if [ $PING_STATUS -eq 0 ]; then
                echo "✅ MySQL is ready!"
                # Verify we can actually connect and query
                QUERY_OUTPUT=$(mysql -h 127.0.0.1 -uroot -proot -e "SELECT 1;" 2>&1)
                QUERY_STATUS=$?
                if [ $QUERY_STATUS -eq 0 ]; then
                  echo "✅ MySQL connection verified!"
                  MYSQL_READY=1
                  break
                else
                  echo "⚠️ mysqladmin ping succeeded but mysql query failed"
                  echo "$QUERY_OUTPUT" | head -3
                fi
              else
                # Show error on first attempt and every 10th attempt
                if [ $i -eq 1 ] || [ $((i % 10)) -eq 0 ]; then
                  echo "⚠️ mysqladmin ping failed (attempt $i/60)"
                  echo "Error: $PING_OUTPUT"
                  echo ""
                fi
              fi
              
              # Show logs periodically
              if [ $((i % 10)) -eq 0 ]; then
                echo "Still waiting for MySQL... (attempt $i/60)"
                show_mysql_logs
                echo ""
                echo "Checking container status:"
                docker ps -a | grep -i mysql | head -1 || echo "  Container not found"
                echo ""
                echo "Testing port connectivity:"
                timeout 2 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/3306' 2>/dev/null && echo "  ✅ Port 3306 is accessible" || echo "  ❌ Port 3306 not accessible"
                echo ""
                echo "Testing connection from inside container:"
                MYSQL_CONTAINER=$(docker ps -a --filter "name=mysql" --format "{{.ID}}" | head -1)
                if [ -n "$MYSQL_CONTAINER" ]; then
                  docker exec "$MYSQL_CONTAINER" mysqladmin ping -h localhost -uroot -proot 2>&1 && echo "  ✅ Container internal connection works" || echo "  ❌ Container internal connection failed"
                fi
                echo ""
              fi
              
              sleep 2
            done
            
            # Final verification if we didn't succeed in the loop
            if [ $MYSQL_READY -eq 0 ]; then
              mysqladmin ping -h 127.0.0.1 -uroot -proot --silent 2>&1
              if [ $? -ne 0 ]; then
                echo "❌ MySQL failed to become ready after 2 minutes"
                echo ""
                echo "Diagnostics:"
                echo "MySQL container status:"
                docker ps -a | grep -i mysql || echo "  ⚠️ Container not found"
                echo ""
                echo "MySQL container logs (last 50 lines):"
                MYSQL_CONTAINER=$(docker ps -a --filter "name=mysql" --format "{{.ID}}" | head -1)
                if [ -n "$MYSQL_CONTAINER" ]; then
                  docker logs --tail=50 "$MYSQL_CONTAINER" 2>&1 || echo "  ⚠️ Cannot read logs"
                else
                  echo "  ⚠️ Container not found"
                fi
                echo ""
                echo "Testing connection with mysqladmin:"
                mysqladmin ping -h 127.0.0.1 -uroot -proot 2>&1 || echo "  ❌ mysqladmin ping failed"
                echo ""
                echo "Testing connection with mysql client:"
                mysql -h 127.0.0.1 -uroot -proot -e "SELECT 1;" 2>&1 || echo "  ❌ mysql query failed"
                echo ""
                echo "Port connectivity:"
                timeout 2 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/3306' 2>/dev/null && echo "  ✅ Port 3306 accessible" || echo "  ❌ Port 3306 not accessible"
                echo ""
                echo "Trying to connect from inside the container:"
                docker exec "$MYSQL_CONTAINER" mysqladmin ping -h localhost -uroot -proot 2>&1 || echo "  ❌ Container exec failed"
                exit 1
              else
                MYSQL_READY=1
              fi
            fi
          else
            echo "⚠️ MySQL client tools not found - using TCP connection test"
            MYSQL_READY=0
            for i in {1..60}; do
              timeout 2 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/3306' 2>/dev/null
              if [ $? -eq 0 ]; then
                echo "✅ MySQL port 3306 is accessible!"
                MYSQL_READY=1
                break
              fi
              
              # Show logs periodically
              if [ $((i % 10)) -eq 0 ]; then
                echo "Still waiting for MySQL... (attempt $i/60)"
                show_mysql_logs
                echo ""
              fi
              
              sleep 2
            done
            
            # Final verification if we didn't succeed in the loop
            if [ $MYSQL_READY -eq 0 ]; then
              timeout 2 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/3306' 2>/dev/null
              if [ $? -ne 0 ]; then
                echo "❌ MySQL port 3306 not accessible after 2 minutes"
                echo ""
                echo "Diagnostics:"
                echo "MySQL container status:"
                docker ps -a | grep -i mysql || echo "  ⚠️ Container not found"
                echo ""
                echo "MySQL container logs (last 50 lines):"
                MYSQL_CONTAINER=$(docker ps -a --filter "name=mysql" --format "{{.ID}}" | head -1)
                if [ -n "$MYSQL_CONTAINER" ]; then
                  docker logs --tail=50 "$MYSQL_CONTAINER" 2>&1 || echo "  ⚠️ Cannot read logs"
                else
                  echo "  ⚠️ Container not found"
                fi
                echo ""
                echo "Checking if port is listening:"
                netstat -an | grep 3306 || ss -an | grep 3306 || echo "  ⚠️ Port 3306 not found"
                exit 1
              else
                MYSQL_READY=1
              fi
            fi
          fi
          
          # Final success message
          if [ ${MYSQL_READY:-0} -eq 1 ]; then
            echo "✅ MySQL is ready and accessible!"
            echo ""
            echo "Final MySQL container status:"
            docker ps -a | grep -i mysql | head -1 || echo "  Container not found"
            echo ""
            echo "MySQL container logs (last 10 lines):"
            show_mysql_logs
            exit 0
          else
            echo "❌ MySQL readiness check failed"
            exit 1
          fi

      - name: Ensure database exists and is ready
        run: |
          echo "🔍 Ensuring databases exist and are ready..."
          MYSQL_CONTAINER=$(docker ps -a --filter "name=mysql" --format "{{.ID}}" | head -1)
          if [ -n "$MYSQL_CONTAINER" ]; then
            # Wait a moment for database to be fully initialized
            sleep 3
            # Create and grant permissions for both test databases
            docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS quizmaker_test;" 2>&1 || true
            docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS quizmaker_test_mysql;" 2>&1 || true
            docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e "GRANT ALL PRIVILEGES ON quizmaker_test.* TO 'bestuser'@'%';" 2>&1 || true
            docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e "GRANT ALL PRIVILEGES ON quizmaker_test_mysql.* TO 'bestuser'@'%';" 2>&1 || true
            docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e "FLUSH PRIVILEGES;" 2>&1 || true
            echo "✅ Databases quizmaker_test and quizmaker_test_mysql are ready!"
          fi

      - name: Flyway migrate (fail fast on schema issues)
        run: |
          # Migrate quizmaker_test (for tests using 'test' profile)
          ./mvnw -B -V -q -DskipTests=true \
            -Dflyway.url="jdbc:mysql://localhost:3306/quizmaker_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC" \
            -Dflyway.user="$SPRING_DATASOURCE_USERNAME" \
            -Dflyway.password="$SPRING_DATASOURCE_PASSWORD" \
            flyway:migrate
          # Migrate quizmaker_test_mysql (for tests using 'test-mysql' profile)
          ./mvnw -B -V -q -DskipTests=true \
            -Dflyway.url="jdbc:mysql://localhost:3306/quizmaker_test_mysql?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC" \
            -Dflyway.user="$SPRING_DATASOURCE_USERNAME" \
            -Dflyway.password="$SPRING_DATASOURCE_PASSWORD" \
            flyway:migrate
          # Verify migrations completed successfully
          echo "✅ Flyway migrations completed for both databases"

      - name: Verify test configuration
        run: |
          echo "🔍 Verifying test configuration..."
          echo "Active profile: $SPRING_PROFILES_ACTIVE"
          echo "Datasource URLs:"
          echo "  - quizmaker_test (for 'test' profile)"
          echo "  - quizmaker_test_mysql (for 'test-mysql' profile)"
          echo "HikariCP max pool size: $SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE"
          echo "HikariCP connection timeout: $SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT"
          echo ""
          echo "Checking if application-test.properties exists:"
          ls -la src/test/resources/application-test.properties || echo "⚠️ application-test.properties not found"
          echo ""
          echo "Checking if application-test-mysql.properties exists:"
          ls -la src/test/resources/application-test-mysql.properties || echo "⚠️ application-test-mysql.properties not found"

      - name: Verify backend offline release gate
        run: |
          set -Eeuo pipefail
          echo "⏳ Waiting 2 seconds before starting tests to ensure database is fully ready..."
          sleep 2

          NETNS="quizmaker-offline"
          HOST_VETH="qm-offline-h"
          TEST_VETH="qm-offline-n"
          HOST_PROXY_PID=""

          cleanup_offline_network() {
            EXIT_CODE=$?
            trap - EXIT INT TERM
            set +e
            if sudo ip netns list | grep -q "^${NETNS}"; then
              for PID in $(sudo ip netns pids "$NETNS"); do
                sudo kill "$PID" 2>/dev/null || true
              done
              sudo ip netns delete "$NETNS" 2>/dev/null || true
            fi
            if [ -n "$HOST_PROXY_PID" ]; then
              kill "$HOST_PROXY_PID" 2>/dev/null || true
            fi
            sudo ip link delete "$HOST_VETH" 2>/dev/null || true
            exit "$EXIT_CODE"
          }
          trap cleanup_offline_network EXIT INT TERM

          sudo ip netns delete "$NETNS" 2>/dev/null || true
          sudo ip link delete "$HOST_VETH" 2>/dev/null || true
          sudo ip netns add "$NETNS"
          sudo ip link add "$HOST_VETH" type veth peer name "$TEST_VETH"
          sudo ip link set "$TEST_VETH" netns "$NETNS"
          sudo ip address add 10.203.0.1/30 dev "$HOST_VETH"
          sudo ip link set "$HOST_VETH" up
          sudo ip netns exec "$NETNS" ip address add 10.203.0.2/30 dev "$TEST_VETH"
          sudo ip netns exec "$NETNS" ip link set lo up
          sudo ip netns exec "$NETNS" ip link set "$TEST_VETH" up

          if sudo ip netns exec "$NETNS" ip route | grep -q '^default'; then
            echo "Offline test namespace unexpectedly has a default route" >&2
            exit 1
          fi

          # Bridge only the namespace's loopback MySQL port to the runner's MySQL service.
          socat TCP4-LISTEN:13306,bind=10.203.0.1,reuseaddr,fork TCP4:127.0.0.1:3306 &
          HOST_PROXY_PID=$!
          sudo ip netns exec "$NETNS" \
            socat TCP4-LISTEN:3306,bind=127.0.0.1,reuseaddr,fork TCP4:10.203.0.1:13306 &

          MYSQL_PROXY_READY=false
          for ATTEMPT in {1..20}; do
            if sudo ip netns exec "$NETNS" timeout 2 bash -c '</dev/tcp/127.0.0.1/3306' 2>/dev/null; then
              MYSQL_PROXY_READY=true
              break
            fi
            sleep 0.25
          done
          if [ "$MYSQL_PROXY_READY" != true ]; then
            echo "MySQL was not reachable inside the offline test namespace" >&2
            exit 1
          fi

          # This is the canonical release gate: no external route, Maven offline,
          # both Surefire lanes, JaCoCo check, and package.
          set +e
          sudo -E ip netns exec "$NETNS" \
            runuser --user "$USER" --preserve-environment -- \
            env HOME="$HOME" ./mvnw -o -B -T 1C -DskipTests=false verify
          TEST_EXIT_CODE=$?
          set -e

          mapfile -t PROVIDER_SOURCES < <(
            grep -RIl --include='*Test.java' \
              '^[[:space:]]*@RealProviderTest[[:space:]]*$' src/test/java || true
          )
          if [ ${#PROVIDER_SOURCES[@]} -eq 0 ]; then
            echo "No @RealProviderTest suites were found; provider inventory contract is broken" >&2
            TEST_EXIT_CODE=1
          fi

          PROVIDER_REPORTS=""
          for PROVIDER_SOURCE in "${PROVIDER_SOURCES[@]}"; do
            PROVIDER_CLASS=$(basename "$PROVIDER_SOURCE" .java)
            MATCHING_REPORTS=$(find target/surefire-reports -type f \
              -name "*${PROVIDER_CLASS}*.xml" -print 2>/dev/null || true)
            if [ -n "$MATCHING_REPORTS" ]; then
              PROVIDER_REPORTS+="${MATCHING_REPORTS}"$'\n'
            fi
          done
          if [ -n "$PROVIDER_REPORTS" ]; then
            echo "Live-provider suite reports were produced during default verification:" >&2
            echo "$PROVIDER_REPORTS" >&2
            TEST_EXIT_CODE=1
          fi

          # Always show root cause errors if any tests failed
          if [ $TEST_EXIT_CODE -ne 0 ]; then
            echo ""
            echo "🔍 Analyzing test failures..."
            echo ""
            echo "=== First failing Surefire report ==="
            FIRST_FAILURE=$(find . -name "*.txt" -path "*/surefire-reports/*" -type f \
              -exec grep -lE "<<< FAILURE|Failures: [1-9]|Errors: [1-9]" {} \; | head -1 || true)
            if [ -n "$FIRST_FAILURE" ]; then
              echo "File: $FIRST_FAILURE"
              echo ""
              head -160 "$FIRST_FAILURE"
            else
              echo "⚠️ Could not find a failing Surefire report; inspect the complete job log and artifacts"
            fi
          fi

          exit $TEST_EXIT_CODE
        continue-on-error: false

      - name: Upload tested backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: quizmaker-backend-jar
          path: target/QuizMaker-*.jar
          if-no-files-found: error
          retention-days: 1

      - name: Show root cause errors
        if: failure()
        run: |
          echo "🔍 Analyzing test failures to find root causes..."
          echo ""
          echo "=== First 10 ApplicationContext failures ==="
          find . -name "*.txt" -path "*/surefire-reports/*" -type f -exec grep -l "ApplicationContext" {} \; | head -10 | while read report; do
            echo ""
            echo "--- $(basename "$report") ---"
            # Show the actual exception that caused the context to fail
            grep -B 5 -A 15 "Caused by:\|Exception\|Error" "$report" | head -25 || head -20 "$report"
            echo ""
          done
          echo ""
          echo "=== Summary of error types ==="
          find . -name "*.txt" -path "*/surefire-reports/*" -type f -exec grep -h "Caused by:" {} \; | sort | uniq -c | sort -rn | head -10

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/*.dump
            **/target/*.dumpstream
            **/target/site/jacoco/**
